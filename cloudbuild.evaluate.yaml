steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.evaluate
      - --build-arg
      - NEXT_PUBLIC_EVAL_SUPABASE_URL=${_SB_URL}
      - --build-arg
      - NEXT_PUBLIC_EVAL_SUPABASE_ANON_KEY=${_SB_ANON}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
