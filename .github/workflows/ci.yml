name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wall:
    name: F13 conflict-of-interest wall (CI-blocking)
    runs-on: ubuntu-latest
    # Runs FIRST and on every push, including before the evaluate product exists. The wall is
    # this company's licence to sell an evaluation tool while also selling a bidder tool: we
    # help bidders win, and we score bids for the buyer. Those two things may share source
    # patterns and may share nothing else. A wall added after the data model is a wall with
    # holes, so the check ships in M0 ahead of the first evaluate feature.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_EVAL_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_EVAL_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: wall check (F13-AC1..3)
        run: ./tools/check-wall.sh

  discovery-guardrails:
    name: G-8/G-9/G-10 discovery guardrails (CI-blocking)
    runs-on: ubuntu-latest
    # Ships before the first source adapter and skips cleanly until app/discovery exists —
    # same reasoning as the wall job above. Module F is the only part of this product that
    # reaches systems we do not own, so its failure mode is legal rather than functional:
    # a login added "just to unblock pagination" turns a public-page reader into a
    # credentialed scraper. Verified against nine planted breaches before being trusted.
    steps:
      - uses: actions/checkout@v4
      - name: discovery guardrails (G-8..G-10)
        run: ./tools/check-discovery-guardrails.sh

  throughput-guardrails:
    name: T-1/T-2/T-3 throughput guardrails (CI-blocking)
    runs-on: ubuntu-latest
    # Ships before F14–F28 and skips cleanly until the code exists — same reasoning as the two
    # jobs above. Covers only what nothing else does: a money-valued column outside
    # bid_financials (bulk intake is the widest new surface on the sealed-bid gate, and no
    # existing test can see a migration), the disclosure filter running before generation rather
    # than after, and the regulatory rulepack being present, parseable data. Model imports in
    # evaluate/deterministic/ and its 100% branch coverage are already enforced by the
    # evaluate-engine job — deliberately not duplicated here.
    steps:
      - uses: actions/checkout@v4
      - name: throughput guardrails (T-1..T-3)
        run: ./tools/check-throughput-guardrails.sh

  engine:
    name: engine (unit + gates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check
      - name: unit tests
        run: uv run pytest tests --ignore=tests/isolation -q
      - name: deterministic gates — 100% branch coverage
        # docs/test-strategy.md: the gates are the product's safety story. --cov-fail-under
        # makes that a build failure rather than an aspiration.
        run: >
          uv run pytest tests --ignore=tests/isolation -q
          --cov=app/deterministic --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: no model imports in app/deterministic (PRD §2.4)
        # Verdicts, gates and coverage counts must stay pure. A pipeline/model import here
        # means model output has crossed into the deterministic column — a defect by
        # definition. docs/conventions.md said this was CI-enforced; now it is.
        run: |
          if grep -rnE '^\s*(from|import)\s+(pipeline|google|anthropic|openai)' app/deterministic/; then
            echo "::error::model/pipeline import inside app/deterministic (PRD §2.4)"
            exit 1
          fi

  isolation:
    name: ET-6 tenant isolation + migration replay (CI-blocking)
    runs-on: ubuntu-latest
    # Runs on EVERY event, forks included. It used to be skipped for forks and gated on repo
    # secrets that were never configured, so this job had never executed once — the Sev-1
    # control we sell to bid consultants was unverified on every push while the check looked
    # like part of a healthy pipeline.
    #
    # Fixed by removing the dependency instead of satisfying it: the suite now runs against a
    # throwaway Supabase stack inside the runner. No secrets, so forks can run it; no shared
    # project, so the permanently-undeletable workspaces this suite creates (audit_events is
    # append-only) are destroyed with the container instead of accumulating in the database we
    # develop against; no shared GoTrue, so password-grant rate limits cannot fail random
    # tests. It is also ~12x faster than the hosted run (2.7s vs 31s) because nothing crosses
    # a network.
    env:
      CI: "true" # conftest.py fails CLOSED under CI — missing creds raise instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: start Supabase (Postgres + GoTrue + PostgREST)
        # A bare Postgres cannot prove this: the suite signs users in through GoTrue and the
        # policies it exercises call auth.uid(). The whole stack is the unit under test.
        run: supabase start

      - name: build the database from the migration chain
        # Replays 0001→N onto an EMPTY database. Nothing else verifies that this chain still
        # works from scratch, and without it we could not stand up staging, move region, or
        # recover from a loss — and would not find out until we tried.
        run: |
          eval "$(supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          SUPABASE_SERVICE_JWT="$SERVICE_ROLE_KEY" DB_URL="$DB_URL" API_URL="$API_URL" \
            ./tools/local-db.sh

      - name: isolation suite (ET-6)
        working-directory: services/engine
        run: |
          eval "$(cd "$GITHUB_WORKSPACE" && supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_JWT="$ANON_KEY" \
          SUPABASE_SERVICE_JWT="$SERVICE_ROLE_KEY" \
            uv run pytest tests/isolation -q -rs

  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: pnpm build

  evaluate-engine:
    name: evaluate engine (unit + gates)
    runs-on: ubuntu-latest
    # Skips cleanly until the surface exists, so this job is safe to land in M0 before code.
    defaults:
      run:
        working-directory: services/evaluate-engine
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          if [ -f services/evaluate-engine/pyproject.toml ]; then echo "go=yes" >> "$GITHUB_OUTPUT";
          else echo "go=no" >> "$GITHUB_OUTPUT"; echo "evaluate engine not scaffolded yet — skipping"; fi
        working-directory: .
      - uses: astral-sh/setup-uv@v5
        if: steps.exists.outputs.go == 'yes'
        with:
          enable-cache: true
      - if: steps.exists.outputs.go == 'yes'
        run: uv sync --frozen
      - name: ruff
        if: steps.exists.outputs.go == 'yes'
        run: uv run ruff check
      - name: unit tests
        if: steps.exists.outputs.go == 'yes'
        run: uv run pytest tests --ignore=tests/isolation -q
      - name: deterministic gates — 100% branch coverage
        # Same rule as the bidder side, and it matters more here: these gates decide
        # responsiveness, qualification and whether a financial envelope may open.
        if: steps.exists.outputs.go == 'yes'
        run: >
          uv run pytest tests --ignore=tests/isolation -q
          --cov=evaluate/deterministic --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: no model imports in evaluate/deterministic
        if: steps.exists.outputs.go == 'yes'
        run: |
          if grep -rnE '^\s*(from|import)\s+(google|anthropic|openai)' evaluate/deterministic/; then
            echo "::error::model import inside evaluate/deterministic — code decides, models do not"
            exit 1
          fi
      - name: sealed-bid gate must be covered at BOTH layers
        # F9 is the one gate whose failure invalidates a tender. Two files, because they prove
        # different things and the second was missing while the product claimed to have it:
        #   test_sealed_bid_gate.py — the predicate is correct
        #   test_sealed_bid_api.py  — no HTTP response carries a price before the lock, which
        #                             is the actual requirement (docs/evaluate/test-strategy.md)
        # The engine reaches PostgREST with the service role and so bypasses RLS; in the serving
        # path the Python guard is the only layer, and the API test is its only regression net.
        if: steps.exists.outputs.go == 'yes'
        run: |
          for f in tests/test_sealed_bid_gate.py tests/test_sealed_bid_api.py; do
            test -f "$f" || { echo "::error::$f missing — F9 is unproven"; exit 1; }
          done
