          - heading "Submission Confirmation and Proposal Validity" [level=3] [ref=f2e38]
          - paragraph [ref=f2e39]: To the esteemed National Informatics Centre, we, Merdian Technology, are honored to present our comprehensive Technical Proposal in response to Tender No. GEM/2026/B/5127401, concerning the Supply of 500 Desktop Computers. This submission reflects our deep understanding of the requirements outlined in the tender document and our commitment to providing high-quality solutions. We hereby confirm that this proposal, inclusive of all its components and commitments, shall remain valid and binding for the entire period stipulated in the tender document, commencing from the designated bid submission date. Merdian Technology further affirms that it has diligently reviewed and thoroughly examined all parts of the tender document, including any and all corrigenda, amendments, or clarifications issued by the Tendering Authority. Our participation in this tender signifies our complete acceptance of all terms, conditions, and specifications set forth therein, without any reservations.
          - heading "Bidder's Standing and Regulatory Compliance" [level=3] [ref=f2e40]
          - paragraph [ref=f2e41]: Merdian Technology maintains a robust financial foundation, as evidenced by the Annual Turnover Certificate provided in Form 6, which details our consistent performance across the past three financial years. This certificate substantiates our capability to undertake projects of significant scale and complexity. In adherence to the mandatory requirements of this tender, we confirm that Merdian Technology is not currently blacklisted, debarred, or suspended by any Central Government, State Government, Public Sector Undertaking, Autonomous Body, or any other private or multinational organization, either in India or abroad. This crucial declaration, submitted on company letterhead and signed by the authorized signatory, is included with our proposal. Furthermore, we affirm that no criminal, vigilance, or anti-corruption cases are pending against our company, its Directors, or its Key Managerial Personnel in any court of law, reinforcing our commitment to ethical business practices.
          - heading "Commitment and Authorization" [level=3] [ref=f2e42]
          - paragraph [ref=f2e43]: Merdian Technology is fully prepared to meet the technical and operational challenges associated with the Supply of 500 Desktop Computers, ensuring timely delivery and adherence to all quality standards. We are committed to a collaborative approach, working closely with the National Informatics Centre to achieve the project's objectives efficiently and effectively. Our proposal is a testament to our dedication to excellence and our understanding of government procurement processes. We confirm our undertaking to comply with all statutory and regulatory requirements applicable to this tender and the subsequent contract, ensuring a smooth and compliant execution. We eagerly anticipate the opportunity to partner with the National Informatics Centre and contribute to its technological infrastructure. This proposal is submitted with the full corporate authority of Merdian Technology, and the undersigned is duly authorized to represent the company in all matters pertaining to this tender. We look forward to your favorable consideration.
