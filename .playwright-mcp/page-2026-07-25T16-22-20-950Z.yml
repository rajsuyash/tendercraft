        - heading "Submission of Technical Proposal" [level=3] [ref=f51e36]
        - paragraph [ref=f51e37]: To The Tender Inviting Authority, MahaIT, we respectfully submit our comprehensive Technical Proposal in response to Tender No. MAHA/IT/2026/4415 for e-Office Software Implementation. This proposal has been meticulously prepared with a thorough understanding of the project's objectives, scope, and the specific requirements outlined in the tender document. We confirm that this proposal shall remain valid for the entire period stipulated in the tender document, commencing from the date of bid submission, and is binding upon Merdian Technology. Merdian Technology has diligently examined all sections of the tender document, including any corrigenda, addenda, and clarifications issued by the Tender Inviting Authority up to the submission deadline. Our submission signifies our unconditional acceptance of all terms, conditions, and technical specifications detailed within the tender document, without any deviations or reservations.
        - heading "Bidder's Eligibility and Declarations" [level=3] [ref=f51e38]
        - paragraph [ref=f51e39]: Merdian Technology confirms its full compliance with all mandatory eligibility criteria stipulated for participation in this tender. As evidenced by the Annual Turnover Certificate provided in Form 6, Merdian Technology has consistently maintained an average annual turnover that meets the prescribed threshold over the financial years FY23, FY24, and FY25. Furthermore, we affirm that Merdian Technology is not currently blacklisted, debarred, or suspended by any Central Government, State Government, Public Sector Undertaking, Autonomous Body, or any other private or multinational organization in India or abroad as on the date of this declaration. This declaration of non-blacklisting is formally submitted on our company letterhead, as required by the tender, and is included as part of our submission in the prescribed format. We also confirm that no criminal, vigilance, or anti-corruption cases are pending against the company, its Directors, or Key Managerial Personnel in any court of law. Merdian Technology has not failed to perform on any contract, nor have any of our contracts been terminated for default, as further detailed in our declaration.
        - heading "Bidder's Capability and Project Approach" [level=3] [ref=f51e40]
        - paragraph [ref=f51e41]: Merdian Technology possesses extensive experience in delivering complex IT and software implementation projects, particularly within the government sector. Our team comprises highly skilled and certified professionals with deep expertise in e-Office solutions, digital transformation, and large-scale system integration. We are committed to deploying a robust, secure, and scalable e-Office software solution that fully aligns with MahaIT's strategic vision for enhanced administrative efficiency and transparency. Our proposed project approach emphasizes a collaborative methodology, ensuring seamless integration with existing government systems and minimal disruption to ongoing operations during the transition. We are dedicated to providing comprehensive support throughout the entire project lifecycle, encompassing detailed planning, phased deployment, rigorous quality assurance, user training, and post-implementation maintenance. This holistic approach ensures a successful and sustainable e-Office environment for MahaIT.
        - heading "Formal Undertaking and Authorization" [level=3] [ref=f51e42]
        - paragraph [ref=f51e43]: We understand that this Technical Proposal, upon acceptance by MahaIT, will constitute a legally binding contract. Merdian Technology undertakes to execute the e-Office Software Implementation project diligently, professionally, and in strict accordance with the agreed-upon scope, timelines, and quality standards set forth in the tender document. The undersigned is fully authorized to submit this proposal on behalf of Merdian Technology and to bind the company to all commitments, terms, and conditions made herein. All information, statements, and documents provided in this proposal are true, accurate, and complete to the best of our knowledge and belief at the time of submission. We look forward to the opportunity to partner with MahaIT and contribute to the successful digital transformation of government processes through this critical e-Office Software Implementation project.
      - paragraph [ref=f51e45]: Approved 25/7/2026
