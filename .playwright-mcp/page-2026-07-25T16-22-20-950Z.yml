      - generic [ref=f51e337]:
        - heading "Comprehensive Support Framework" [level=3] [ref=f51e338]
        - paragraph [ref=f51e339]: Our support model is structured to provide robust and responsive assistance throughout the operational lifecycle of the e-Office solution. This framework incorporates a multi-tier support system, ensuring that issues are addressed by personnel with appropriate expertise. The initial point of contact for all user queries and incidents will be a dedicated help-desk, accessible through multiple channels including a web-based portal, email, and telephone. This help-desk serves as the Level 1 support, responsible for initial logging, categorization, and resolution of common issues based on a comprehensive knowledge base. All reported incidents are systematically logged into a centralized ticketing system, which assigns a unique identifier for tracking and audit purposes. Issues requiring deeper technical investigation or specialized knowledge are seamlessly escalated to Level 2 support, comprising subject matter experts with in-depth understanding of the e-Office application and underlying infrastructure. Complex problems, including those necessitating code changes or vendor engagement for third-party components, are further escalated to Level 3 support, involving core development and architecture teams. The entire process emphasizes clear communication with the user at each stage, providing regular updates on the status and expected resolution time.
        - heading "Incident Management and Service Level Commitments" [level=3] [ref=f51e340]
        - paragraph [ref=f51e341]: Effective incident management is critical to maintaining service continuity and user satisfaction. We define incident severity levels to prioritize response and resolution efforts, aligning with the operational impact on MahaIT's business processes. Critical incidents are those that result in a complete system outage or significant data loss, severely impacting core e-Office functionalities. High-severity incidents denote major functional impairments affecting a substantial number of users or critical modules, without a complete system failure. Medium-severity incidents represent partial functional degradation or issues affecting a limited number of users, with workarounds often available. Low-severity incidents encompass minor bugs, cosmetic issues, or general queries that do not impede core operations. For each severity level, specific response and resolution commitments are established, ensuring that critical issues receive immediate attention and are resolved within the agreed-upon service level parameters. An automated escalation matrix is integrated into the ticketing system, triggering alerts to higher management levels if an incident approaches or breaches its defined service level objective. This proactive escalation mechanism ensures that all stakeholders are informed and appropriate resources are mobilized to prevent service level breaches.
        - heading "Proactive Operations and Maintenance" [level=3] [ref=f51e342]
        - paragraph [ref=f51e343]: Our operations and maintenance strategy encompasses both preventive and corrective measures to ensure the continuous optimal performance and availability of the e-Office system. Preventive maintenance activities include scheduled system health checks, performance tuning, log analysis, and database optimization to identify and mitigate potential issues before they impact operations. Corrective maintenance involves the prompt diagnosis and resolution of identified defects or performance bottlenecks, ensuring the system operates as intended. Patching, upgrades, and release management are conducted through a structured process, beginning with thorough testing in a staging environment to ensure compatibility and stability. Deployment of patches and new releases is scheduled during pre-approved maintenance windows to minimize disruption to users, with prior communication to all stakeholders. Continuous monitoring tools are deployed to track system performance, resource utilization, and security events in real-time, providing immediate alerts for any anomalies. Regular data backups are performed, with a defined frequency and retention policy, and stored securely in an offsite location to protect against data loss. A comprehensive disaster recovery plan is in place, outlining procedures for data restoration and system recovery in the event of a major outage, with periodic drills conducted to validate its effectiveness. This proactive approach to O&M aims to maximize system uptime and ensure data integrity.
        - heading "SLA Governance and Continuous Improvement" [level=3] [ref=f51e344]
        - paragraph [ref=f51e345]: Service Level Agreement (SLA) governance is a cornerstone of our commitment to delivering high-quality support. SLA measurement is performed using automated tools that capture key metrics such as incident response times, resolution times, and system availability. These metrics are compiled into periodic performance reports, providing transparent insights into service delivery against agreed-upon targets. Regular review meetings will be conducted with MahaIT's designated representatives to discuss service performance, analyze trends, and address any deviations from the SLA. During these reviews, root cause analysis will be performed for critical incidents and recurring issues to identify underlying problems and implement permanent solutions. A continuous improvement process is embedded within our support operations, leveraging feedback from users, performance data, and technological advancements to refine our methodologies and enhance service quality. This iterative approach ensures that the support framework evolves to meet the changing needs of MahaIT and the e-Office system.
        - heading "Seamless Exit and Transition Management" [level=3] [ref=f51e346]
        - paragraph [ref=f51e347]: At the conclusion of the contract period, a structured exit and transition plan will be executed to ensure a smooth and risk-free handover of the e-Office system and its operations. This plan prioritizes comprehensive knowledge transfer to MahaIT's internal teams or a successor vendor, ensuring operational continuity. Knowledge transfer activities will include detailed documentation of system architecture, configurations, operational procedures, and troubleshooting guides. Dedicated training sessions and shadowing opportunities will be provided to familiarize the receiving team with the system's intricacies and daily operational tasks. All relevant project artefacts, including source code, deployment scripts, database schemas, and administrative credentials, will be formally handed over. A phased transition approach will be adopted, allowing for parallel operations and gradual assumption of responsibilities by the successor team, minimizing any potential service disruption. Support will be provided during a defined transition period to address any immediate queries or issues encountered by the new operational team. This meticulous planning ensures that MahaIT retains full control and operational capability of the e-Office solution without interruption.
      - paragraph [ref=f51e349]: Approved 25/7/2026
