[project]
name = "tendercraft-evaluate-engine"
version = "0.1.0"
description = "TenderCraft Evaluate — government-side tender evaluation engine"
requires-python = ">=3.12"
dependencies = [
    # Pinned for the same reason as the bidder engine: fastapi 0.139/starlette 1.3 broke
    # include_router (routes mount as path=None).
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-multipart>=0.0.18",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=5.0.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["evaluate/deterministic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
