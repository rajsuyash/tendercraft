[project]
name = "tendercraft-engine"
version = "0.1.0"
description = "TenderCraft engine — deterministic compliance gates + AI pipeline (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pypdf>=5.1",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["app/deterministic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Live-API integration tests: long REST call lines read better unwrapped.
"tests/isolation/*" = ["E501"]
